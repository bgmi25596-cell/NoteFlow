name: Build NoteFlow APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o develop-noteflow-android-app.zip -d project
          ls -la project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Android APK
        run: |
          cd project
          find . -name gradlew -type f
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoteFlow-APK
          path: project/android/app/build/outputs/apk/debug/*.apk
